[project]
name = "dragonfipy"
version = "0.1.0"
description = "DragonFi API wrapper"
readme = "README.md"
authors = [{ name = "Chris Irag", email = "iragca@pm.me" }]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dateutil>=2.9.0.post0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 79
indent-width = 4

[tool.ty.environment]
python = ".venv"
[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
